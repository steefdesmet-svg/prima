<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#174d36">
  <meta name="description" content="Walker Pro 0.1.2 - wandelroutes zoeken en als GPX downloaden.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="./css/style.css?v=0.1.2">
  <title>Walker Pro 0.1.2</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">🥾 Walker Pro</div>
      <div class="version">versie 0.1.2</div>
    </div>
    <button id="installBtn" class="install hidden" type="button">Installeer app</button>
  </header>

  <main>
    <section class="panel controls">
      <h1>Wandelroutes rond mij</h1>
      <p class="intro">Zoek bewegwijzerde wandelroutes binnen een gekozen straal, navigeer naar een instappunt of download de route als GPX voor je Garmin.</p>

      <div class="fields">
        <label>Straal
          <span><input id="radiusKm" type="number" min="1" max="50" step="1" value="15"> km</span>
        </label>
        <label>Minimumafstand
          <span><input id="minKm" type="number" min="0" max="50" step="0.5" value="4"> km</span>
        </label>
        <label>Maximumafstand
          <span><input id="maxKm" type="number" min="1" max="80" step="0.5" value="20"> km</span>
        </label>
      </div>

      <button id="searchBtn" class="primary" type="button">📍 Zoek wandelroutes</button>
      <div class="status"><strong>Status</strong><div id="statusText">Klaar.</div></div>
    </section>

    <section class="map-section">
      <div id="map" aria-label="Kaart met wandelroutes"></div>
    </section>

    <section class="panel results-panel">
      <div class="results-head">
        <h2>Resultaten</h2>
        <span id="resultCount">0 routes</span>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <template id="routeTemplate">
    <article class="route-card">
      <div class="route-top">
        <div>
          <h3 class="route-name"></h3>
          <p class="route-info"></p>
        </div>
        <span class="route-distance"></span>
      </div>
      <p class="route-start"></p>
      <div class="actions">
        <button class="show-route" type="button">🗺 Bekijk route</button>
        <button class="download-gpx" type="button">⬇ GPX</button>
        <a class="navigate" target="_blank" rel="noopener">🚗 Breng mij erheen</a>
      </div>
    </article>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./js/app.js?v=0.1.2"></script>
</body>
</html>
